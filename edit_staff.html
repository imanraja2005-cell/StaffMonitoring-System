
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Staff</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin-top: 80px;
}

.card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 30px;
}

h2 {
    color: #a78bfa;
    text-align: center;
    margin-bottom: 30px;
}

.form-label {
    color: #cbd5e1;
}

.form-control, .form-select {
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
    padding: 12px;
}

.form-control:focus, .form-select:focus {
    background: #0f172a;
    color: white;
    border-color: #8b5cf6;
    box-shadow: none;
}

.form-select option {
    background: #1e293b;
    color: white;
}

.btn-purple {
    background: #7c3aed;
    color: white;
    border: none;
}

.btn-purple:hover {
    background: #6d28d9;
    color: white;
}
</style>
</head>

<body>

<div class="container">

<div class="card shadow-lg">

<h2>✏️ Edit Staff Details</h2>

<form method="POST">

<div class="mb-3">
<label class="form-label">Staff Name</label>
<input type="text"
class="form-control"
name="name"
value="{{ staff['name'] }}"
required>
</div>

<div class="mb-3">
<label class="form-label">Department</label>
<input type="text"
class="form-control"
name="department"
value="{{ staff['department'] }}"
required>
</div>

<div class="mb-4">
<label class="form-label">Status</label>

<select class="form-select" name="status">

<option value="Present"
{% if staff['status'] == 'Present' %}selected{% endif %}>
Present
</option>

<option value="Absent"
{% if staff['status'] == 'Absent' %}selected{% endif %}>
Absent
</option>

</select>
</div>

<button type="submit" class="btn btn-purple w-100">
Update Staff
</button>

<a href="{{ url_for('staff_management') }}"
class="btn btn-secondary w-100 mt-3">
Cancel
</a>

</form>

</div>
</div>

</body>
</html>
